# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: beststream-stremio-jean
    runtime: docker
    repo: https://github.com/diasjean100/beststream-stremio
    branch: main
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=192
