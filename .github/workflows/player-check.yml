name: Verify real player extraction
on:
  push:
    paths:
      - scripts/smoke.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  player:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=optional --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
