name: Inspect Nexa public routing
on:
  push:
    paths:
      - scripts/nexa-inspect.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/nexa-inspect.js
