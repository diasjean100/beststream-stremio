name: Verify hosted video from second host
on:
  push:
    branches: [main]
    paths:
      - scripts/hosted-smoke.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/hosted-smoke.js
